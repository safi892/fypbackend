[project]
name = "fyp-cpp-code-review-backend"
version = "0.2.0"
description = "Hybrid C++ code-review backend (FastAPI): deterministic static analysis + AI generation, backward compatible with the existing mobile client."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.135.2",
    "huggingface_hub>=0.23.1",
    "numpy<2",
    "protobuf>=7.34.1",
    "sentencepiece>=0.2.1",
    "torch==2.0.1",
    "transformers==4.40.2",
    "tree-sitter>=0.23,<0.26",
    "tree-sitter-cpp>=0.23,<0.24",
    "uvicorn[standard]>=0.42.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]


# --- Linting & formatting (enforces a single clean code style) -------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports / undefined names)
    "I",   # import sorting
    "UP",  # pyupgrade (modern syntax)
    "B",   # bugbear (likely bugs)
    "ANN", # missing type annotations
]

[tool.ruff.lint.per-file-ignores]
# Tests and the entrypoint are allowed looser annotation rules.
"tests/*" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["app"]


# --- Static type checking (strict: no untyped code allowed) -----------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
plugins = ["pydantic.mypy"]

# These ML libraries ship without type stubs; treat their imports as `Any`
# rather than failing the whole strict build.
[[tool.mypy.overrides]]
module = ["transformers.*", "torch.*", "tree_sitter.*"]
ignore_missing_imports = true


# --- Tests ------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
